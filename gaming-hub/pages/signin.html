<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Quest &amp; Guides</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0805;color:#e0d4c0;font-family:'Inter',system-ui,sans-serif}
.auth-bg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;background:linear-gradient(135deg,#0a0805 0%,#12100d 50%,#0d0b08 100%)}
.auth-bg::before{content:'';position:fixed;inset:0;background:url('/gaming-hub/assets/img/games/ac-shadows-hero.jpg') center/cover no-repeat;opacity:.08;z-index:0;pointer-events:none}
.auth-card{position:relative;z-index:1;background:rgba(18,16,13,.95);border:1px solid rgba(185,145,75,.3);border-radius:14px;padding:2.5rem 2rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.auth-logo{text-align:center;margin-bottom:1.75rem}
.auth-logo a{font-family:'Cinzel',serif;font-size:1.35rem;font-weight:700;color:#b9914b;text-decoration:none;letter-spacing:.08em}
.auth-logo a span{color:#d4a85c}
.auth-title{font-family:'Cinzel',serif;font-size:1.5rem;color:#e8d5a3;text-align:center;margin:0 0 .4rem;font-weight:700}
.auth-sub{color:#7a6a5a;font-size:.875rem;text-align:center;margin:0 0 1.75rem}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:.75rem;width:100%;padding:.8rem 1rem;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#e0d4c0;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;margin-bottom:.75rem;font-family:'Inter',sans-serif}
.oauth-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(185,145,75,.45);color:#fff}
.oauth-btn svg{width:20px;height:20px;flex-shrink:0}
.divider{display:flex;align-items:center;gap:1rem;margin:1.25rem 0;color:#4a3a2a;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(185,145,75,.15)}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.8rem;color:#9a8a7a;margin-bottom:.4rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.form-group input{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.04);border:1px solid rgba(185,145,75,.15);border-radius:8px;color:#e0d4c0;font-size:.9rem;font-family:'Inter',sans-serif;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:#b9914b;background:rgba(185,145,75,.05)}
.submit-btn{width:100%;padding:.85rem;background:linear-gradient(135deg,#b9914b,#d4a85c);border:none;border-radius:8px;color:#0a0805;font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:.5rem;letter-spacing:.06em}
.submit-btn:hover{opacity:.88}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-footer{text-align:center;margin-top:1.5rem;font-size:.85rem;color:#7a6a5a}
.auth-footer a{color:#b9914b;text-decoration:none}
.auth-footer a:hover{text-decoration:underline}
.error-msg{background:rgba(220,53,69,.12);border:1px solid rgba(220,53,69,.3);color:#ff7a8a;padding:.7rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem;display:none}
.error-msg.show{display:block}
.success-msg{background:rgba(40,167,69,.12);border:1px solid rgba(40,167,69,.3);color:#6fd98a;padding:.7rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem;display:none}
.success-msg.show{display:block}
</style>
</head>
<body>
<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-logo"><a href="/gaming-hub/">⚔ Quest <span>&amp;</span> Guides</a></div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Sign in to sync your progress across devices</p>
    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>

    <button class="oauth-btn" id="btn-google">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>

    <div class="divider">or sign in with email</div>

    <form id="signin-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create one free</a>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const API = 'https://ggcodex-auth-api.onrender.com';
const GOOGLE_CLIENT_ID = '37671617721-pn0u7rooas9qitune89chh9eti12pu5g.apps.googleusercontent.com';

const errEl = document.getElementById('error-msg');
const sucEl = document.getElementById('success-msg');
function showErr(m){errEl.textContent=m;errEl.classList.add('show');sucEl.classList.remove('show')}
function showSuc(m){sucEl.textContent=m;sucEl.classList.add('show');errEl.classList.remove('show')}
function clearMsg(){errEl.classList.remove('show');sucEl.classList.remove('show')}

// Redirect if already signed in
try{const t=localStorage.getItem('qag_token');const u=localStorage.getItem('qag_user');if(t&&u){const n=new URLSearchParams(window.location.search).get('next')||'/gaming-hub/';window.location.href=n;}}catch(e){}

function saveSession(token, user){
  localStorage.setItem('qag_token', token);
  localStorage.setItem('qag_user', JSON.stringify(user));
  // Legacy key for qag-auth.js compatibility
  localStorage.setItem('qag_session', JSON.stringify({...user, token}));
}

// Email/password sign in
document.getElementById('signin-form').addEventListener('submit', async e => {
  e.preventDefault(); clearMsg();
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Signing in…'; btn.disabled = true;
  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})
    });
    const data = await res.json();
    const tok = data.token || data.access_token;
    if (tok) {
      saveSession(tok, data.user || {email: document.getElementById('email').value});
      showSuc('Signed in! Redirecting…');
      setTimeout(() => {const n=new URLSearchParams(window.location.search).get('next')||'/gaming-hub/';window.location.href=n;}, 800);
    } else {
      showErr(data.detail || data.error || 'Sign in failed. Check your email and password.');
      btn.textContent = 'Sign In'; btn.disabled = false;
    }
  } catch(err) {
    showErr('Connection error. Please try again.');
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
});

// Google Sign In
document.getElementById('btn-google').addEventListener('click', () => {
  if (!window.google) { showErr('Google is still loading. Please wait a moment and try again.'); return; }
  clearMsg();
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: async resp => {
      clearMsg();
      try {
        const res = await fetch(API + '/api/auth/google', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({id_token: resp.credential})
        });
        const data = await res.json();
        const tok = data.token || data.access_token;
        if (tok) {
          saveSession(tok, data.user || {});
          showSuc('Signed in with Google! Redirecting…');
          setTimeout(() => {const n=new URLSearchParams(window.location.search).get('next')||'/gaming-hub/';window.location.href=n;}, 800);
        } else {
          showErr(data.detail || data.error || 'Google sign-in failed.');
        }
      } catch(err) {
        showErr('Connection error. Please try again.');
      }
    }
  });
  google.accounts.id.prompt();
});
</script>
</body>
</html>
