<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Quest & Guides</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:#0a0a0f}
.auth-card{background:#12121a;border:1px solid rgba(185,145,75,.25);border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:1.5rem}.auth-logo a{font-family:'Cinzel',serif;font-size:1.4rem;color:#b9914b;text-decoration:none}
.auth-title{font-family:'Cinzel',serif;font-size:1.5rem;color:#e8d5a3;text-align:center;margin:0 0 .5rem}
.auth-sub{color:#8a8a9a;font-size:.875rem;text-align:center;margin:0 0 2rem}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:.75rem;width:100%;padding:.75rem 1rem;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#e0e0e8;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;margin-bottom:.75rem;font-family:'Inter',sans-serif}
.oauth-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(185,145,75,.4)}
.oauth-btn svg{width:20px;height:20px;flex-shrink:0}
.divider{display:flex;align-items:center;gap:1rem;margin:1.25rem 0;color:#555;font-size:.8rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
.form-group{margin-bottom:1rem}.form-group label{display:block;font-size:.8rem;color:#9a9aaa;margin-bottom:.4rem;font-weight:500}
.form-group input{width:100%;padding:.7rem .9rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e0e0e8;font-size:.9rem;font-family:'Inter',sans-serif;box-sizing:border-box;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:#b9914b}
.submit-btn{width:100%;padding:.8rem;background:linear-gradient(135deg,#b9914b,#d4a85c);border:none;border-radius:8px;color:#0a0a0f;font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:.5rem}
.submit-btn:hover{opacity:.9}
.auth-footer{text-align:center;margin-top:1.5rem;font-size:.85rem;color:#8a8a9a}
.auth-footer a{color:#b9914b;text-decoration:none}.auth-footer a:hover{text-decoration:underline}
.error-msg{background:rgba(220,53,69,.15);border:1px solid rgba(220,53,69,.3);color:#ff6b7a;padding:.7rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem;display:none}
.error-msg.show{display:block}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><a href="/gaming-hub/">⚔ Quest &amp; Guides</a></div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Sign in to sync your progress across devices</p>
    <div id="error-msg" class="error-msg"></div>
    <button class="oauth-btn" id="btn-google">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="oauth-btn" id="btn-apple">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      Continue with Apple
    </button>
    <div class="divider">or sign in with email</div>
    <form id="signin-form">
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required autocomplete="email"></div>
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"></div>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="signup.html">Create one free</a></div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="../assets/js/qag-auth.js"></script>
<script>
const errEl=document.getElementById('error-msg');
function showErr(m){errEl.textContent=m;errEl.classList.add('show')}
function clearErr(){errEl.classList.remove('show')}
if(QAGAuth.isSignedIn()){const n=new URLSearchParams(window.location.search).get('next')||'/gaming-hub/';window.location.href=n}
document.getElementById('signin-form').addEventListener('submit',async e=>{
  e.preventDefault();clearErr();
  const btn=e.target.querySelector('button[type=submit]');btn.textContent='Signing in…';btn.disabled=true;
  const r=await QAGAuth.signIn(document.getElementById('email').value,document.getElementById('password').value);
  if(r.success){const n=new URLSearchParams(window.location.search).get('next')||'/gaming-hub/';window.location.href=n}
  else{showErr(r.error||'Sign in failed.');btn.textContent='Sign In';btn.disabled=false}
});
document.getElementById('btn-google').addEventListener('click',()=>{
  if(!window.google){showErr('Google SDK not loaded. Try refreshing.');return}
  google.accounts.id.initialize({client_id:'GOOGLE_CLIENT_ID_PLACEHOLDER',callback:async resp=>{
    clearErr();const r=await QAGAuth.signInWithGoogle(resp.credential);
    if(r.success){const n=new URLSearchParams(window.location.search).get('next')||'/gaming-hub/';window.location.href=n}
    else showErr(r.error||'Google sign-in failed.')
  }});google.accounts.id.prompt();
});
document.getElementById('btn-apple').addEventListener('click',async()=>{
  if(!window.AppleID){showErr('Apple Sign In not available in this browser.');return}
  try{const resp=await AppleID.auth.signIn();const r=await QAGAuth.signInWithApple(resp.authorization.id_token,resp.user);
    if(r.success){const n=new URLSearchParams(window.location.search).get('next')||'/gaming-hub/';window.location.href=n}
    else showErr(r.error||'Apple sign-in failed.')}
  catch{showErr('Apple sign-in was cancelled.')}
});
</script>
</body>
</html>
